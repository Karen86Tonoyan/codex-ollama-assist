# Codex CLI → local Ollama (OpenAI-compatible).
# Copy to %USERPROFILE%\.codex\config.toml  OR  run:  scripts\use-ollama-for-codex.ps1
#
# Default model matches this machine: gpt-oss:20b-gpu (MXFP4, num_ctx 65536).
# Unblocked Qwen F16 stays at 32768 — do not set 65536 on that tag.

model = "gpt-oss:20b-gpu"
model_provider = "ollama"
approval_policy = "on-request"

[model_providers.ollama]
name = "Ollama"
base_url = "http://127.0.0.1:11434/v1"
wire_api = "chat"
env_key = "OLLAMA_API_KEY"

[sandbox]
mode = "workspace-write"
